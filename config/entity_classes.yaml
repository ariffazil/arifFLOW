# arifFlow Entity Classification
# Maps actor_id → entity class for FQ governance weighting
# Doctrine: E6 (Actors Are Not Equal), E4 (Not All Receipts Are Reality)
#
# Classes:
#   human_agent       — consequence-bearing interactive agent (YES influence FQ)
#   interactive_session — one-shot sessions (CONDITIONAL influence FQ)
#   daemon            — background daemons (INDIRECT — should NOT influence FQ)
#   infrastructure    — infrastructure services (NO influence FQ)
#   synthetic         — synthetic generators (NO influence FQ)
#
# FQ Governance Rule:
#   Only human_agent and interactive_session should determine FQ verdict.
#   daemon/infrastructure/synthetic receipts are telemetry, not governance.

# --- Human Agents (consequence-bearing, interactive) ---
# 2026-09-17 FI-008 patch: added `arif` (F13 SOVEREIGN — was unlisted despite
# appearing in 5+ receipts as actor). Doctrine E6 (actors not equal) — sovereign
# MUST be classified as consequence-bearing for governance FQ to be computable.
human_agent:
  - arif
  - arifos:ariffazil
  - ariffazil
  - arif-fazil
  - qwen-code
  - fi-003-qwen-code
  - FI-003
  - kimi-code/FI-008
  - claude-code
  - opencode
  - grok
  - GROK
  # 2026-09-20: live ACT token actor is `GROK`; yaml match is case-sensitive.
  - grok-build
  # 2026-09-20: grok-build ≡ FI-007 ≡ GROK (kernel identity.py). Launched harness, not a daemon.
  - FI-007
  - fi-007
  - hermes
  - hermes-asi
  - hermes-prime
  - 333-AGI
  - 333-agi
  - arifos:333-agi
  - FI-009
  - antigravity
  - agy
# 2026-09-20 FI-007: live receipts use actor_id `hermes` and `fi-007`.
# `hermes-asi` was listed; the ledger name is `hermes` → entity_class=unknown,
# consequence_bearing=false, metabolic_state UNKNOWN_ACTOR. Alias only.
# Does not reclassify hermes-cron (infrastructure). YAML is loaded at MCP
# process start — live report stays stale until that process recycles.

# --- Interactive Sessions (sometimes consequence-bearing) ---
interactive_session:
  # 2026-10-03 alignment: 333-AGI spawned subagent lanes appeared as actor
  # `333-agi/memory-helix` (held=true, EXECUTION DOMINANCE, class=unknown →
  # excluded from governance FQ by DEFAULT not by decision — entity_report
  # top_unclassified). Spawned one-shot task lanes = interactive_session.
  # Convention: any `333-agi/<lane>` or `333-AGI/<lane>` subagent actor that is
  # NOT a standing patrol (patrols stay daemon:) gets listed here on sighting.
  - 333-agi/memory-helix
  - codex
  - codex-startup
  # 2026-10-25 APEX-ZEN: codex-fi-005 = FI-fleet cron CLI (tech-debt scan /8h),
  # one-shot task lane in the codex family — interactive_session per the
  # spawned-lane convention above. Window 2026-10-25: 0 Execute / 0 Verify
  # (cron emits no /ingest receipts — wiring gap or idle; reported as no-activity).
  - codex-fi-005
  - FI-003
  - fi-003-anonymous

# --- Background Daemons (indirect consequence, no FQ influence) ---
# 2026-10-01 FI-003 backfill: patrol/loop emitters that were unlisted and so
# resolved to "unknown" (excluded by accident). Grounded in their own ledger
# rows, not their names — dynamic-gate (2775 Verify + 987 Seal, payload = FQ
# drift dump), rsi-loop (981 Verify, null payload), agentic-web / atlas-sync
# (drift-clean patrols), morning-briefing (Execute+Seal daily product loop).
daemon:
  - aed-v1
  - orchestrator-v1
  - 333-AGI/dynamic-gate
  - hermes-rsi-loop
  - 333-AGI/agentic-web
  - 333-AGI/atlas-sync
  - morning-briefing
  # 2026-10-25 APEX-ZEN backfill (same doctrine as 2026-10-01): the 5 actors that
  # resolved to "unknown" at runtime and were excluded from governance FQ by
  # DEFAULT rather than by decision (entity_report top_unclassified). Grounded in
  # their own ledger rows (0 Execute / 1 Verify each — standing patrol shape),
  # not their names.
  - governance-hotspot-detector
  - governance-drift-batch
  - contradiction-accumulator
  # chron reality-impact attestor (timer-driven, 1 Verify/day attestation rows)
  - chron-reality-impact-attestor

# --- Infrastructure Services (no consequence) ---
# 2026-10-01 FI-003 coverage backfill (Reality Graph connectivity audit): actors
# that were unlisted resolved to "unknown" at runtime and were excluded from
# governance FQ by DEFAULT rather than by decision. Declaring them here changes
# no number — unknown, daemon, infrastructure and synthetic all exclude — it
# converts an accidental exclusion into a stated one, and shrinks the residue
# where a genuine gap could hide. Each entry is grounded in its own ledger rows
# (step_type mix + session shape), sampled 2026-10-01, not in its name.
infrastructure:
  - hermes-cron
  - a-forge
  # organ CHRON writing its own cycle results (sessions chron-loop-test-*)
  - chron
  # kernel emitting cooling overrides (session "cooling-override")
  - arifos

