# arifFlow Entity Classification
# Maps actor_id → entity class for FQ governance weighting
# Doctrine: E6 (Actors Are Not Equal), E4 (Not All Receipts Are Reality)
#
# Classes:
#   human_agent       — consequence-bearing interactive agent (YES influence FQ)
#   interactive_session — one-shot sessions (CONDITIONAL influence FQ)
#   daemon            — background daemons (INDIRECT — should NOT influence FQ)
#   infrastructure    — infrastructure services (NO influence FQ)
#   synthetic         — synthetic generators (NO influence FQ)
#
# FQ Governance Rule:
#   Only human_agent and interactive_session should determine FQ verdict.
#   daemon/infrastructure/synthetic receipts are telemetry, not governance.

# --- Human Agents (consequence-bearing, interactive) ---
# 2026-09-17 FI-008 patch: added `arif` (F13 SOVEREIGN — was unlisted despite
# appearing in 5+ receipts as actor). Doctrine E6 (actors not equal) — sovereign
# MUST be classified as consequence-bearing for governance FQ to be computable.
human_agent:
  - arif
  - qwen-code
  - fi-003-qwen-code
  - FI-003
  - kimi-code/FI-008
  - claude-code
  - opencode
  - grok
  - GROK
  # 2026-09-20: live ACT token actor is `GROK`; yaml match is case-sensitive.
  - grok-build
  # 2026-09-20: grok-build ≡ FI-007 ≡ GROK (kernel identity.py). Launched harness, not a daemon.
  - FI-007
  - fi-007
  - hermes
  - hermes-asi
  - hermes-prime
  - 333-AGI
  - FI-009
  - antigravity
  - agy
# 2026-09-20 FI-007: live receipts use actor_id `hermes` and `fi-007`.
# `hermes-asi` was listed; the ledger name is `hermes` → entity_class=unknown,
# consequence_bearing=false, metabolic_state UNKNOWN_ACTOR. Alias only.
# Does not reclassify hermes-cron (infrastructure). YAML is loaded at MCP
# process start — live report stays stale until that process recycles.

# --- Interactive Sessions (sometimes consequence-bearing) ---
interactive_session:
  - codex
  - codex-startup
  - FI-003
  - fi-003-anonymous

# --- Background Daemons (indirect consequence, no FQ influence) ---
daemon:
  - aed-v1
  - orchestrator-v1

# --- Infrastructure Services (no consequence) ---
infrastructure:
  - hermes-cron
  - a-forge

# --- Synthetic Generators (no reality, pure noise) ---
synthetic:
  - p0-metabolize
  - reexamine
