[package]
name = "arifflow"
version = "2026.7.26"
edition = "2024"
description = "arifFlow — Attention Metabolism & Governed Parallel Execution Engine (U = E × M × D)"
authors = ["Arif (F13 SOVEREIGN) <arifbfazil@gmail.com>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
blake3 = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha3 = "0.12"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3"
