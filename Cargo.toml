[package]
name = "ariflow"
version = "0.1.0"
edition = "2024"
description = "arifFlow — Governed Parallel Execution Engine for the arifOS Federation"
authors = ["Arif (F13 SOVEREIGN) <arifbfazil@gmail.com>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
blake3 = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"

[dev-dependencies]
tempfile = "3"
