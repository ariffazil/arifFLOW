    - production seal
    - genesis bridge activation
  risks:
    - compatibility: callers of Sovereign888 must update match arms
    - pattern_exhaustiveness: Rust will catch any non-exhaustive match at compile time
  rollback:
    method: git revert <commit>
    side_effects: reverts to single Sovereign888 conflated variant
  acceptance_tests:
