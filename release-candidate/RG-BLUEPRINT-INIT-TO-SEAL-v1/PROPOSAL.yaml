# ── PROPOSAL P3: FlowReceipt v2 candidate fields ─────────────────────────────

P3:
  claim: |
    FlowReceipt gains a `schema` version string, `graph_id`, `receipt_kind`,
    and an `integrity` block containing `payload_hash` (SHA3-256) as a
    serialized field. These are the minimal v2 fields needed for cross-language
    hash contracts and receipt_kind routing.
    Full v2 envelope (authority, outcome, consequence, classification) is
    deferred — marked CANDIDATE, not activated.
  current_state: |
    FlowReceipt: v1-with-graph-edges
    Missing: schema, graph_id, receipt_kind, payload_hash as serialized field
    Hash exists as method (receipt.hash()) but not as sealed field
  change_scope:
    files:
      - src/receipt.rs
    interfaces:
      - 'Add: schema: Option<String>  (default: "arifflow.receipt/v1")'
      - 'Add: graph_id: Option<String>'
      - 'Add: receipt_kind: Option<ReceiptKind>'
      - 'Add: payload_hash: Option<String>  (SHA3-256 of canonical JSON)'
    data_migrations:
      - Existing receipts deserialize cleanly: all new fields are Option<T>
      - Old receipts without these fields remain valid (backward compat)
  not_in_scope:
    - full authority block
    - full outcome block
    - full consequence block
    - full classification block
    - JCS implementation (see P4)
    - deploy
    - production seal
  risks:
    - compatibility: serde skip_serializing_if="Option::is_none" prevents breaking old receipts
    - >-
      hash_divergence: payload_hash field is serialized AFTER it is computed — field must be
      excluded from its own hash computation (chicken-and-egg). Solution: hash = SHA3-256 of
      receipt body WITH payload_hash=null, then set payload_hash = that hash.
  rollback:
    method: git revert <commit>
    side_effects: removes schema/graph_id/receipt_kind/payload_hash fields; old receipts unaffected
  acceptance_tests:
    - old_receipt_deserializes_without_schema_field
    - new_receipt_carries_schema_version
    - receipt_kind_enum_covers_all_blueprint_variants
    - payload_hash_excludes_itself_from_computation
    - round_trip_serialize_deserialize_matches
  escalation:
    judge: JUDGE_888
    sovereign: SOVEREIGN_F13

