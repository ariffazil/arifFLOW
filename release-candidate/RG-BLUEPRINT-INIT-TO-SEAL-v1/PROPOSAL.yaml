    - `SovereignF13` — for irreversible or canonical transitions (F13 only)
    DivergenceDetected maps to Judge888 (hold and evaluate), not SovereignF13.
    A new escalation path for SovereignF13 is reserved for genesis bridge
    activation, memory promotion, and production seal — all HOLD in current mandate.
  current_state: |
    EscalationTarget::Sovereign888 conflates JUDGE_888 and SOVEREIGN_F13
    requires_888_hold() returns true for Sovereign888
    DivergenceDetected -> Sovereign888
    No variant represents F13 human-only authority
  change_scope:
    files:
      - src/topology/controlled_cycle.rs
    interfaces:
      - EscalationTarget enum: add SovereignF13, rename Sovereign888 -> Judge888
    data_migrations: []
  not_in_scope:
